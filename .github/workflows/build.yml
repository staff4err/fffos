name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q furryFemboyOS.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
        working-directory: furryFemboyOS
      - uses: actions/upload-artifact@v4
        with:
          name: furryFemboyOS-apk
          path: furryFemboyOS/app/build/outputs/apk/debug/app-debug.apk
      - run: sed -i '/resumeWhilePaused/d' furryFemboyOS/app/src/main/AndroidManifest.xml
